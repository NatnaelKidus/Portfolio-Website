<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact Me</title>
        <link rel="stylesheet" href="CSS/base.css">
        <link rel="stylesheet" href="CSS/desktop.css" media="screen and (min-width: 1024px)">
        <link rel="stylesheet" href="CSS/tablet.css" media="screen and (min-width: 600px) and (max-width: 1023px)">
        <link rel="stylesheet" href="CSS/mobile.css" media="screen and (max-width: 599px)">
    </head>

    <body>
        <header>
            <div class="header-top">
                <a class="site-name" href="index.html">Natnael Kidus</a>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About Me</a></li>
                        <li><a href="projects.html">Projects</a></li>
                        <li><a href="contact.html" class="active">Contact Me</a></li>
                    </ul>
                </nav>
                <div class="clear"></div>
            </div>
            <div class="header-title">
                <h1>Contact Me</h1>
                <div class="title-line"></div>
                <p class="header-description">Have a question? Send me a message.</p>
            </div>
        </header>

        <main>
            <section class="form-container">
                <h2>Get in Touch</h2>
                <form action="#" method="post">

                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required placeholder="name@gmail.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Cell Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required placeholder="123-456-7890">
                        <small>Example: 123-456-7890 (include the area code).</small>
                    </div>

                    <div class="form-group">
                        <label for="comments">Comments:</label>
                        <textarea id="comments"  name="comments" rows="5" required maxlength="2000" placeholder="Type your message here..."></textarea>
                    </div>

                    <button type="submit" class="gradient-btn">Submit</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Contact: <a href="mailto:natnael.kidus@ontariotechu.net">natnael.kidus@ontariotechu.net</a></p>
            <p>&copy; 2026 Natnael Kidus. All rights reserved.</p>
        </footer>
    

    </body>
</html>
